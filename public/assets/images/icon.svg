<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    App icon: Warm Earth vinyl deck. Cream squircle tile on the canvas
    backing, a record with grooves and a mint label, and the deck's
    tonearm (counterweight, thin wand, pivot bearing, headshell with a
    teal cartridge and stylus tab).
  -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d1" />
      <stop offset="0.5" stop-color="#fafaf9" />
      <stop offset="1" stop-color="#a3a39e" />
    </linearGradient>
    <linearGradient id="counterweight" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#9ca3af" />
      <stop offset="0.5" stop-color="#f0eeec" />
      <stop offset="1" stop-color="#d1d5db" />
    </linearGradient>
  </defs>

  <!-- Canvas backing + tile -->
  <rect width="1024" height="1024" fill="#e8e0d4" />
  <rect x="41" y="41" width="942" height="942" rx="207" fill="#f6f2ec" stroke="#e8e0d4" stroke-width="2" />

  <!-- Record: ink rim, vinyl with grooves, mint label, teal spindle -->
  <circle cx="512" cy="512" r="306" fill="#1a1a1a" stroke="#221d16" stroke-width="12" />
  <g fill="none" stroke="#111" stroke-width="4">
    <circle cx="512" cy="512" r="146" />
    <circle cx="512" cy="512" r="162" />
    <circle cx="512" cy="512" r="178" />
    <circle cx="512" cy="512" r="194" />
    <circle cx="512" cy="512" r="210" />
    <circle cx="512" cy="512" r="226" />
    <circle cx="512" cy="512" r="242" />
    <circle cx="512" cy="512" r="258" />
    <circle cx="512" cy="512" r="274" />
    <circle cx="512" cy="512" r="290" />
  </g>
  <circle cx="512" cy="512" r="118" fill="#d9efec" stroke="#221d16" stroke-width="8" />
  <circle cx="512" cy="512" r="26" fill="#0f766e" />

  <!-- Tonearm assembly, above the record like the deck -->
  <!-- Counterweight behind the bearing, pointing up-right -->
  <rect x="833" y="89" width="56" height="120" rx="12" fill="url(#counterweight)" transform="rotate(-141 861 149)" />
  <!-- Thin wand from the pivot center, end hidden under the headshell -->
  <rect x="807" y="207" width="290" height="20" rx="10" fill="url(#metal)" stroke="#a3a39e" stroke-width="2" transform="rotate(108 807 217)" />
  <!-- Pivot bearing cap -->
  <circle cx="807" cy="217" r="56" fill="url(#metal)" stroke="#a3a39e" stroke-width="2" />
  <circle cx="807" cy="217" r="12" fill="#8a8072" />
  <!-- Headshell: shell, teal cartridge, stylus tab (local coords) -->
  <g transform="translate(709 508) rotate(118)">
    <rect x="-47" y="-24.5" width="94" height="49" rx="9" fill="#f0eeec" stroke="#9ca3af" stroke-width="3" />
    <rect x="-37" y="-15" width="48" height="30" rx="10" fill="#0f766e" />
    <rect x="22" y="-3.5" width="21" height="7" rx="2" fill="#9ca3af" />
  </g>
</svg>
